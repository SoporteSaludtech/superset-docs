site_name: Portal BI & Analítica Asistencial - Hosvital
site_url: https://soportesaludtech.github.io/superset-docs/
site_description: Documentación técnica, funcional y operativa de los tableros de control en Apache Superset.
site_author: Equipo de Inteligencia de Negocios
use_directory_urls: true

theme:
name: material
language: es
palette:
- scheme: default
primary: indigo
accent: blue
toggle:
icon: material/brightness-7
name: Cambiar a modo oscuro
- scheme: slate
primary: indigo
accent: blue
toggle:
icon: material/brightness-4
name: Cambiar a modo claro
features:
- navigation.tabs
- navigation.sections
- navigation.top
- search.suggest
- search.highlight
- content.code.copy

markdown_extensions:

admonition

pymdownx.details

pymdownx.superfences

pymdownx.highlight:
anchor_linenums: true

pymdownx.inlinehilite

pymdownx.snippets

pymdownx.arithmatex:
generic: true

tables

attr_list

extra_javascript:

https://polyfill.io/v3/polyfill.min.js?features=es6

https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:

Inicio: index.md

Tableros Asistenciales:

Egresos y Urgencias: dashboards/01-egresos-urgencias.md

Calidad e IAAS: dashboards/04-vigilancia-iaas.md

Tableros Financieros:

Prefacturación y Producción: dashboards/02-prefacturacion.md

Tableros Quirúrgicos:

Órdenes y Programación QX: dashboards/03-ordenes-quirurgicas.md
